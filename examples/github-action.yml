name: FoxyGEO
on:
  pull_request:
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: AI readiness lint
        run: npx --yes @foxygeo/audit --ci --publish example.com
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
